[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "onemail"
version = "0.1.0"
description = "Deterministic email threat detection and evidence-grounded investigation"
requires-python = ">=3.10"
dependencies = [
    "docker>=7.1,<8",
    "langchain-core>=0.3,<2",
    "langchain-openai>=1.1,<2",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
# QR-code decoding for quishing detection. Optional so core detection stays
# dependency light; install with:  python -m pip install "onemail[qr]"
qr = [
    "opencv-python-headless>=4.9,<5",
    "numpy>=1.26,<3",
]
dev = [
    "Flask>=3.0,<4",
    "markdown>=3.5,<4",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<5",
    "Pillow>=10,<12",
    "piexif>=1.1,<2",
    "qrcode>=7.4,<9",
    "xlwt>=1.3,<2",
]

[tool.setuptools.packages.find]
include = ["agentic*", "dataset*", "detection*", "reporting*", "scripts*"]

[tool.setuptools.package-data]
"agentic.intelligence" = ["catalog/*.json"]
