[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "onemail"
version = "0.1.0"
description = "Deterministic email threat detection and evidence-grounded investigation"
requires-python = ">=3.10"
dependencies = [
    "docker>=7.1,<8",
    "langchain-core>=0.3,<2",
    "langchain-deepseek>=1.1,<2",
    "pydantic>=2.10,<3",
]

[tool.setuptools.packages.find]
include = ["agentic*", "dataset*", "detection*", "reporting*", "scripts*"]

[tool.setuptools.package-data]
"agentic.intelligence" = ["catalog/*.json"]
